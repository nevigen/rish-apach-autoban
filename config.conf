# Настройки Apache AutoBan. При первой установке файл копируется в /etc/apache-autoban/.
# Приоритет: переменные окружения > этот файл > значения по умолчанию.
AUTOBAN_LANG=ru
MIN_REQUESTS=3
BAN_TIME=86400
# ZONE='' = автоопределение (единственная активная зона firewalld).
ZONE=''
# 1 = искать стоп-слова только в пути URL с учётом границ; 0 = искать по всей строке запроса.
AUTOBAN_STRICT_MATCH=0
